<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAKI PAY</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  padding: 20px;
  background: #0f172a;
  margin: 0;
  color:#f8fafc;
}
.container {
  max-width: 500px;
  margin: auto;
  background: #1e293b;
  padding: 24px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}

/* Cabeçalho com logo + título + ícone cartão */
.header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 8px;
}
.logo img{
  width: 70px;
  height: 70px;
  border-radius: 12px;
}
h2 {
  color: #38bdf8;
  margin: 0;
  font-size: 28px;
  font-weight: 800;
}
.card-icon {
  width: 40px;
  height: 40px;
}

/* Subtítulo */
.subtitle {
  text-align: center;
  color: #94a3b8;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 20px;
}

label {
  display: block;
  margin-top: 12px;
  font-weight: 600;
  color: #94a3b8;
  font-size: 14px;
}
select, input, button {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border-radius: 8px;
  border: 1px solid #334155;
  font-size: 16px;
  background:#0f172a;
  color:#f8fafc;
}
select:focus, input:focus {
  outline:none;
  border-color:#38bdf8;
}
button {
  background: #38bdf8;
  color: white;
  border: none;
  font-weight: 700;
  cursor: pointer;
  margin-top: 16px;
}
button:active { opacity: 0.8; }
.hidden { display: none; }
.payment-box {
  background: #1e40af20;
  padding: 16px;
  border-radius: 8px;
  margin-top: 12px;
  border-left: 4px solid #38bdf8;
}
.total-box {
  background: #1e40af20;
  padding: 12px;
  border-radius: 8px;
  margin: 12px 0;
}
.fee-info{font-size:13px;color:#94a3b8;margin-top:6px;}
</style>
</head>
<body>
<div class="container">
  
  <!-- Cabeçalho -->
  <div class="header">
    <div class="logo">
      <img src="logo.png" alt="DakiPay Logo">
    </div>
    <h2>DAKI PAY</h2>
    <!-- Ícone de cartão SVG -->
    <svg class="card-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="5" width="20" height="14" rx="2" stroke="#38bdf8" stroke-width="2"/>
      <path d="M2 10H22" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="18" cy="15" r="1.5" fill="#38bdf8"/>
      <circle cx="15" cy="15" r="1.5" fill="#38bdf8"/>
    </svg>
  </div>

  <!-- Subtítulo em maiúsculas -->
  <div class="subtitle">PAGAMENTOS SEM SAIR DE CASA</div>

  <!-- Passo 1: Escolher Serviço -->
  <div id="step1">
    <label>Nome do Cliente:</label>
    <input type="text" id="nome-cliente" placeholder="Ex: João Silva" required>

    <label>Serviço:</label>
    <select id="servico" onchange="mostrarOpcoes()">
      <option value="">-- Escolhe --</option>
      <option value="recarga">Recarga Telefónica</option>
      <option value="tv">TV</option>
      <option value="credelec">Credelec</option>
      <option value="agua">Água</option>
    </select>

    <div id="opcoes-recarga" class="hidden">
      <label>Operadora:</label>
      <select id="op-recarga">
        <option value="">-- Escolhe --</option>
        <option value="Vodacom" data-fee="2.5">Vodacom</option>
        <option value="Movitel" data-fee="3">Movitel</option>
        <option value="Tmcel" data-fee="3.5">Tmcel</option>
      </select>
    </div>

    <div id="opcoes-tv" class="hidden">
      <label>Operadora TV:</label>
      <select id="tv-op">
        <option value="">-- Escolhe --</option>
        <option value="ZAP">ZAP</option>
        <option value="GOtv">GOtv</option>
        <option value="DStv">DStv</option>
        <option value="StarTimes">StarTimes</option>
      </select>
      <label>Pacote:</label>
      <select id="tv-pacote">
        <option value="">-- Escolhe pacote --</option>
      </select>
    </div>

    <label>Número/Conta:</label>
    <input type="text" id="conta" placeholder="84XXXXXXX ou Nº Conta">

    <label>WhatsApp do Cliente:</label>
    <input type="tel" id="cliente-tel" placeholder="841234567">

    <label>Valor (MT):</label>
    <input type="number" id="valor" placeholder="200" min="10">

    <div class="fee-info" id="feeInfo"></div>
    <button onclick="irParaPagamento()">Continuar</button>
  </div>

  <!-- O resto do teu código continua igual daqui pra baixo -->
  <!-- Passo 2, Passo 3 e <script>... -->
