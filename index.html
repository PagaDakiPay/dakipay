<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DakiPay</title>
<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --primary: #22c55e;
  --text: #f8fafc;
  --muted: #94a3b8;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
body { background: var(--bg); color: var(--text); padding: 20px; }
.container { max-width: 500px; margin: 0 auto; }
.logo { text-align: center; margin-bottom: 20px; }
.logo img { 
  width: 80px; 
  height: 80px; 
  border-radius: 50%; 
  animation: girar 4s linear infinite; 
}
@keyframes girar { 
  from { transform: rotate(0deg); } 
  to { transform: rotate(360deg); } 
}
h2 { text-align: center; margin-bottom: 20px; color: var(--primary); }
.card { background: var(--card); padding: 20px; border-radius: 16px; margin-bottom: 15px; }
.form-group { margin-bottom: 15px; }
.form-label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--muted); }
.form-input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: var(--text); font-size: 16px; }
.btn { width: 100%; padding: 14px; border: none; border-radius: 10px; background: var(--primary); color: #0f172a; font-weight: bold; font-size: 16px; cursor: pointer; }
.btn:hover { opacity: 0.9; }
.receipt { display: none; background: #fff; color: #000; padding: 20px; border-radius: 16px; }
.receipt-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <img src="logo.png" alt="DakiPay Logo">
  </div>
  <h2>DAKI PAY</h2>

  <div class="card">
    <form id="orderForm">
      <div class="form-group">
        <label class="form-label" for="customerName">Nome do Cliente</label>
        <input id="customerName" type="text" class="form-input" placeholder="Ex: João Silva" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="service">Serviço</label>
        <select id="service" required>
          <option value="">Seleciona</option>
          <option value="M-Pesa">M-Pesa</option>
          <option value="e-Mola">e-Mola</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="account">Número/Conta</label>
        <input id="account" type="text" class="form-input" placeholder="84xxxxxxx" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="amount">Valor em MT</label>
        <input id="amount" type="number" class="form-input" placeholder="10" min="10" required>
      </div>

      <button type="submit" class="btn">Gerar Pedido</button>
    </form>
  </div>

  <div id="receipt" class="receipt">
    <div style="text-align: center; margin-bottom: 15px;">
      <img src="logo.png" style="width: 60px; height: 60px; border-radius: 50%;">
      <h3>DakiPay</h3>
      <p style="font-size: 12px;">Recibo de Pagamento</p>
    </div>
    <div id="receiptDetails"></div>
    <button onclick="window.print()" class="btn" style="margin-top: 15px;">Imprimir</button>
  </div>
</div>

<script>
document.getElementById('orderForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const customerName = document.getElementById('customerName').value;
  const service = document.getElementById('service').value;
  const account = document.getElementById('account').value;
  const amount = parseFloat(document.getElementById('amount').value);
  
  let fee;
  if (amount === 10) {
    fee = 1;
  } else {
    fee = amount * 0.03;
    if (fee < 1) fee = 1;
  }
  
  const total = amount + fee;
  const ref = 'DKP' + Date.now().toString().slice(-6);
  
  const details = `
    <div class="receipt-row"><span>Cliente:</span><span>${customerName}</span></div>
    <div class="receipt-row"><span>Serviço:</span><span>${service}</span></div>
    <div class="receipt-row"><span>Conta:</span><span>${account}</span></div>
    <div class="receipt-row"><span>Valor:</span><span>${amount} MT</span></div>
    <div class="receipt-row"><span>Taxa:</span><span>${fee.toFixed(2)} MT</span></div>
    <div class="receipt-row"><span><strong>Total:</strong></span><span><strong>${total.toFixed(2)} MT</strong></span></div>
    <div class="receipt-row"><span>Ref:</span><span>${ref}</span></div>
    <div class="receipt-row"><span>Data:</span><span>${new Date().toLocaleString('pt-MZ')}</span></div>
  `;
  
  document.getElementById('receiptDetails').innerHTML = details;
  document.getElementById('receipt').style.display = 'block';
  document.getElementById('receipt').scrollIntoView({ behavior: 'smooth' });
});
</script>
</body>
</html>
